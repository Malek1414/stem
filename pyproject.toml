[project]
name = "agent-forge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["iroh>=1.2,<2", "a2a-sdk>=1.3,<2", "mcp>=1.10"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
